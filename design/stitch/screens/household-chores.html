<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
          font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Checkbox */
        .chore-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid theme('colors.outline');
            border-radius: 50%;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .chore-checkbox::before {
            content: "";
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em theme('colors.on-primary');
            background-color: theme('colors.primary');
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .chore-checkbox:checked {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }

        .chore-checkbox:checked::before {
            transform: scale(1);
        }
        
        .chore-item:has(input:checked) .chore-text {
            text-decoration: line-through;
            color: theme('colors.outline');
        }
        
        /* Progress Bar Animation */
        @keyframes fillProgress {
            from { width: 0; }
            to { width: var(--target-width); }
        }
        .progress-fill {
            animation: fillProgress 1s ease-out forwards;
        }
        
        /* Ambient Shadow */
        .shadow-ambient-1 {
            box-shadow: 0px 2px 4px rgba(37, 99, 235, 0.04), 0px 4px 12px rgba(37, 99, 235, 0.04);
        }
    </style>

<script>
        // Simple JS for tab switching visual (functional implementation would require state management)
        document.querySelectorAll('button[aria-selected]').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('button[aria-selected]').forEach(t => {
                    t.setAttribute('aria-selected', 'false');
                    t.className = 'flex-1 py-2 font-label-md text-label-md text-center rounded-md text-on-surface-variant hover:text-primary hover:bg-surface-container-lowest/50 transition-all';
                });
                const clicked = e.target;
                clicked.setAttribute('aria-selected', 'true');
                clicked.className = 'flex-1 py-2 font-label-md text-label-md text-center rounded-md bg-surface-container-lowest text-primary shadow-sm transition-all';
            });
        });
